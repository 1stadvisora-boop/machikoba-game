<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b2432">
<meta name="description" content="自作アプリを公開するアプリストア">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231b2432'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle'%3E🧰%3C/text%3E%3C/svg%3E">
<title>My App Store</title>
<style>
  :root{
    --bg:#1b2432; --panel:#0d1420; --card:#233042; --card2:#2b3a4f;
    --text:#f0ead6; --muted:#9fb3c8; --accent:#ffd166; --accent2:#ff9f68;
    --green:#06d6a0; --blue:#5aa9e6; --line:#34455c;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    background:var(--bg); color:var(--text);
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent; min-height:100%;
  }
  button{ font-family:inherit; }
  a{ color:inherit; }

  #wrap{ max-width:720px; margin:0 auto; padding:calc(12px + var(--sat)) 16px calc(40px + var(--sab)); }

  /* ---- ヘッダー ---- */
  header{ display:flex; align-items:center; gap:12px; padding:6px 0 14px; }
  #logo{
    width:44px; height:44px; border-radius:12px; background:var(--panel);
    display:grid; place-items:center; font-size:24px; flex:none;
    box-shadow:0 2px 0 #000 inset;
  }
  #storeName{ font-size:20px; font-weight:bold; color:var(--accent); line-height:1.2; text-shadow:0 2px 0 #7a4a12; }
  #storeTagline{ font-size:12px; color:var(--muted); margin-top:2px; }

  /* ---- 検索 ---- */
  #searchWrap{ position:relative; }
  #search{
    width:100%; font-size:16px; padding:12px 40px 12px 42px; border-radius:14px;
    border:1px solid var(--line); background:var(--panel); color:var(--text); outline:none;
  }
  #search:focus{ border-color:var(--blue); }
  #search::placeholder{ color:#6f8299; }
  #searchIcon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none; }
  #clearSearch{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    border:none; background:transparent; color:var(--muted); font-size:18px; padding:6px 8px; cursor:pointer; display:none;
  }
  #clearSearch.show{ display:block; }

  /* ---- カテゴリタブ ---- */
  #tabs{ display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  #tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:none; border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:20px; padding:7px 14px; font-size:13px; font-weight:bold; cursor:pointer; white-space:nowrap;
  }
  .tab.active{ background:var(--accent); color:var(--bg); border-color:var(--accent); }

  /* ---- ツールバー ---- */
  #toolbar{ display:flex; justify-content:space-between; align-items:center; padding:10px 2px 6px; font-size:12px; color:var(--muted); }
  #sort{ border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:8px; padding:5px 8px; font-size:12px; }

  /* ---- セクション ---- */
  h2{ font-size:14px; color:var(--accent); letter-spacing:1px; margin:18px 2px 10px; display:flex; align-items:center; gap:8px; }
  h2 small{ color:var(--muted); font-weight:normal; letter-spacing:0; }

  /* ---- おすすめ（横スクロール） ---- */
  #featured{ display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; scrollbar-width:none; }
  #featured::-webkit-scrollbar{ display:none; }
  .hero{
    flex:none; width:min(86%,320px); scroll-snap-align:start; cursor:pointer;
    background:linear-gradient(135deg,#2b3a4f,#1f2a3a); border:1px solid var(--line);
    border-radius:18px; padding:16px; display:flex; gap:14px; align-items:center;
  }
  .hero .icon{ font-size:44px; width:64px; height:64px; }
  .hero .name{ font-size:17px; }

  /* ---- カードグリッド ---- */
  #grid,#recent{ display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width:560px){ #grid,#recent{ grid-template-columns:1fr 1fr; } }
  .card{
    display:flex; gap:12px; align-items:center; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:12px; cursor:pointer;
    transition:transform .08s, background .15s;
  }
  .card:active{ transform:scale(.985); background:var(--card2); }
  .icon{
    flex:none; width:56px; height:56px; border-radius:14px; background:var(--panel);
    display:grid; place-items:center; font-size:30px; overflow:hidden;
  }
  .icon img{ width:100%; height:100%; object-fit:cover; }
  .meta{ flex:1; min-width:0; }
  .name{ font-size:15px; font-weight:bold; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tagline{ font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chips{ display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .chip{ font-size:10px; padding:1px 7px; border-radius:6px; background:var(--panel); color:var(--blue); font-weight:bold; }
  .chip.cat{ color:var(--green); }
  .chip.new{ background:var(--accent2); color:var(--bg); }
  .open{
    flex:none; font-size:13px; font-weight:bold; color:var(--bg);
    background:linear-gradient(180deg,var(--accent),var(--accent2));
    border:none; border-radius:20px; padding:9px 16px; box-shadow:0 3px 0 #b06a2c; cursor:pointer;
    text-decoration:none;
  }
  .open:active{ transform:translateY(2px); box-shadow:0 1px 0 #b06a2c; }

  #empty{ text-align:center; color:var(--muted); font-size:13px; padding:40px 0; line-height:1.8; display:none; }
  #empty.show{ display:block; }

  footer{ text-align:center; color:#6f8299; font-size:11px; margin-top:36px; line-height:1.8; }

  /* ---- 詳細シート ---- */
  #backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s; }
  #backdrop.show{ opacity:1; pointer-events:auto; }
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:50; max-width:720px; margin:0 auto;
    background:var(--panel); border-radius:22px 22px 0 0; border-top:1px solid var(--line);
    max-height:92vh; overflow-y:auto; padding:10px 20px calc(24px + var(--sab));
    transform:translateY(105%); transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  #sheet.show{ transform:translateY(0); }
  #grip{ width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px; }
  #sheetHead{ display:flex; gap:14px; align-items:center; }
  #sheetHead .icon{ width:72px; height:72px; font-size:40px; border-radius:18px; background:var(--card); }
  #sheetName{ font-size:20px; font-weight:bold; color:#fff; line-height:1.3; }
  #sheetTagline{ font-size:13px; color:var(--muted); margin-top:4px; }
  #sheetInfo{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .info{ font-size:11px; color:var(--muted); background:var(--card); border-radius:8px; padding:5px 9px; }
  .info b{ color:var(--text); }
  #sheetActions{ display:flex; gap:10px; margin-top:16px; }
  #sheetActions .open{ flex:1; text-align:center; padding:14px; font-size:16px; border-radius:30px; }
  .ghost{
    flex:none; border:1px solid var(--line); background:transparent; color:var(--text);
    border-radius:30px; padding:0 16px; font-size:14px; cursor:pointer;
  }
  #shots{ display:flex; gap:10px; overflow-x:auto; margin-top:16px; scrollbar-width:none; }
  #shots img{ height:220px; border-radius:12px; border:1px solid var(--line); flex:none; }
  #sheetDesc{ font-size:13px; line-height:1.9; color:#cfd8e3; margin-top:16px; white-space:pre-line; }
  #sheetTags{ margin-top:12px; }
  #closeSheet{ position:absolute; right:14px; top:12px; border:none; background:var(--card); color:var(--muted);
    width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; }

  /* ---- トースト ---- */
  #toast{
    position:fixed; left:50%; bottom:calc(30px + var(--sab)); transform:translateX(-50%) translateY(20px);
    background:var(--accent); color:var(--bg); font-weight:bold; font-size:13px;
    padding:10px 18px; border-radius:20px; opacity:0; pointer-events:none; transition:all .2s; z-index:60;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div id="logo">🧰</div>
    <div>
      <div id="storeName">My App Store</div>
      <div id="storeTagline"></div>
    </div>
  </header>

  <div id="searchWrap">
    <span id="searchIcon">🔍</span>
    <input id="search" type="search" placeholder="アプリを検索" autocomplete="off" aria-label="アプリを検索">
    <button id="clearSearch" aria-label="検索をクリア">✕</button>
  </div>

  <div id="tabs"></div>

  <section id="featuredSec">
    <h2>⭐ おすすめ</h2>
    <div id="featured"></div>
  </section>

  <section id="recentSec" style="display:none">
    <h2>🕘 最近開いたアプリ</h2>
    <div id="recent"></div>
  </section>

  <div id="toolbar">
    <span id="count"></span>
    <label>並び替え
      <select id="sort">
        <option value="updated">新着順</option>
        <option value="name">名前順</option>
      </select>
    </label>
  </div>

  <div id="grid"></div>
  <div id="empty">該当するアプリがありません。<br>検索ワードやカテゴリを変えてみてください。</div>

  <footer id="footer"></footer>
</div>

<div id="backdrop"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
  <div id="grip"></div>
  <button id="closeSheet" aria-label="閉じる">✕</button>
  <div id="sheetHead">
    <div class="icon" id="sheetIcon"></div>
    <div class="meta">
      <div id="sheetName"></div>
      <div id="sheetTagline"></div>
    </div>
  </div>
  <div id="sheetInfo"></div>
  <div id="sheetActions">
    <a class="open" id="sheetOpen" target="_blank" rel="noopener">開く</a>
    <button class="ghost" id="shareBtn">共有</button>
  </div>
  <div id="shots"></div>
  <div id="sheetDesc"></div>
  <div id="sheetTags" class="chips"></div>
</div>
<div id="toast"></div>

<script src="apps.js"></script>
<script>
(function(){
  const STORE = window.APP_STORE || { name:"My App Store", apps:[] };
  const APPS  = (STORE.apps || []).filter(a => a && a.id && a.name);
  const $ = id => document.getElementById(id);
  const RECENT_KEY = "appstore.recent";
  const NEW_DAYS = 14;

  // ---- 状態 ----
  let query = "", category = "すべて", sort = "updated";

  // ---- 初期表示 ----
  document.title = STORE.name || "My App Store";
  $("storeName").textContent = STORE.name || "My App Store";
  $("storeTagline").textContent = STORE.tagline || "";
  $("footer").innerHTML = `${esc(STORE.owner || "")}<br>アプリ ${APPS.length} 件`;

  // ---- ユーティリティ ----
  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function iconHTML(a){
    const ic = a.icon || "📦";
    return /\.(png|jpe?g|svg|webp|gif)$/i.test(ic) || ic.startsWith("data:") || ic.startsWith("http")
      ? `<img src="${esc(ic)}" alt="">` : esc(ic);
  }
  function isNew(a){
    if(!a.updated) return false;
    const d = (Date.now() - new Date(a.updated).getTime()) / 864e5;
    return d >= 0 && d <= NEW_DAYS;
  }
  function fmtDate(s){
    if(!s) return "";
    const d = new Date(s); if(isNaN(d)) return s;
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
  }
  function toast(msg){
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
  }
  function getRecent(){ try{ return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); }catch{ return []; } }
  function pushRecent(id){
    try{
      const r = [id, ...getRecent().filter(x => x !== id)].slice(0, 6);
      localStorage.setItem(RECENT_KEY, JSON.stringify(r));
    }catch{}
  }
  function appURL(a){
    return a.url || "#";
  }

  // ---- カテゴリタブ ----
  function renderTabs(){
    const cats = ["すべて", ...new Set(APPS.map(a => a.category).filter(Boolean))];
    $("tabs").innerHTML = cats.map(c =>
      `<button class="tab${c===category?" active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  }
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if(!b) return;
    category = b.dataset.cat; renderTabs(); renderGrid();
  });

  // ---- フィルタ・並び替え ----
  function filtered(){
    const q = query.trim().toLowerCase();
    let list = APPS.filter(a => category === "すべて" || a.category === category);
    if(q){
      list = list.filter(a => [a.name, a.tagline, a.description, a.category, ...(a.tags||[])]
        .join(" ").toLowerCase().includes(q));
    }
    list.sort((x, y) => sort === "name"
      ? String(x.name).localeCompare(String(y.name), "ja")
      : String(y.updated||"").localeCompare(String(x.updated||"")));
    return list;
  }

  // ---- カード ----
  function cardHTML(a, cls="card"){
    const chips = [
      a.category ? `<span class="chip cat">${esc(a.category)}</span>` : "",
      isNew(a) ? `<span class="chip new">NEW</span>` : "",
      ...(a.tags||[]).slice(0,3).map(t => `<span class="chip">${esc(t)}</span>`)
    ].join("");
    return `<div class="${cls}" data-id="${esc(a.id)}" role="button" tabindex="0">
      <div class="icon">${iconHTML(a)}</div>
      <div class="meta">
        <div class="name">${esc(a.name)}</div>
        <div class="tagline">${esc(a.tagline || "")}</div>
        <div class="chips">${chips}</div>
      </div>
      <a class="open" href="${esc(appURL(a))}" target="_blank" rel="noopener" data-open="${esc(a.id)}">開く</a>
    </div>`;
  }

  function renderFeatured(){
    const f = APPS.filter(a => a.featured);
    $("featuredSec").style.display = f.length && !query && category === "すべて" ? "" : "none";
    $("featured").innerHTML = f.map(a => cardHTML(a, "hero")).join("");
  }
  function renderRecent(){
    const ids = getRecent();
    const list = ids.map(id => APPS.find(a => a.id === id)).filter(Boolean);
    const show = list.length && !query && category === "すべて";
    $("recentSec").style.display = show ? "" : "none";
    $("recent").innerHTML = list.map(a => cardHTML(a)).join("");
  }
  function renderGrid(){
    const list = filtered();
    $("grid").innerHTML = list.map(a => cardHTML(a)).join("");
    $("empty").classList.toggle("show", list.length === 0);
    $("count").textContent = `${list.length} 件`;
    renderFeatured(); renderRecent();
  }

  // ---- クリック（カード → 詳細 / 開くボタン → 起動） ----
  document.addEventListener("click", e => {
    const open = e.target.closest("[data-open]");
    if(open){ pushRecent(open.dataset.open); return; } // リンク遷移はそのまま
    const card = e.target.closest("[data-id]");
    if(card) openSheet(card.dataset.id);
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Enter" && e.target.matches("[data-id]")) openSheet(e.target.dataset.id);
    if(e.key === "Escape") closeSheet();
  });

  // ---- 検索・並び替え ----
  $("search").addEventListener("input", e => {
    query = e.target.value; $("clearSearch").classList.toggle("show", !!query); renderGrid();
  });
  $("clearSearch").addEventListener("click", () => {
    query = ""; $("search").value = ""; $("clearSearch").classList.remove("show"); renderGrid(); $("search").focus();
  });
  $("sort").addEventListener("change", e => { sort = e.target.value; renderGrid(); });

  // ---- 詳細シート ----
  let current = null;
  function openSheet(id){
    const a = APPS.find(x => x.id === id); if(!a) return;
    current = a;
    $("sheetIcon").innerHTML = iconHTML(a);
    $("sheetName").textContent = a.name;
    $("sheetTagline").textContent = a.tagline || "";
    $("sheetInfo").innerHTML = [
      a.category ? `<span class="info">カテゴリ <b>${esc(a.category)}</b></span>` : "",
      a.version  ? `<span class="info">バージョン <b>${esc(a.version)}</b></span>` : "",
      a.updated  ? `<span class="info">更新 <b>${esc(fmtDate(a.updated))}</b></span>` : "",
      a.platform ? `<span class="info">環境 <b>${esc(a.platform)}</b></span>` : "",
      /^https?:/i.test(a.url||"") ? `<span class="info">外部サイト</span>` : ""
    ].join("");
    $("sheetOpen").href = appURL(a);
    $("sheetOpen").dataset.open = a.id;
    $("shots").innerHTML = (a.screenshots||[]).map(s => `<img src="${esc(s)}" alt="${esc(a.name)} のスクリーンショット" loading="lazy">`).join("");
    $("shots").style.display = (a.screenshots||[]).length ? "" : "none";
    $("sheetDesc").textContent = a.description || a.tagline || "";
    $("sheetTags").innerHTML = (a.tags||[]).map(t => `<span class="chip">${esc(t)}</span>`).join("");
    $("backdrop").classList.add("show"); $("sheet").classList.add("show");
    if(location.hash !== `#app=${a.id}`) history.replaceState(null, "", `#app=${encodeURIComponent(a.id)}`);
  }
  function closeSheet(){
    if(!current) return;
    current = null;
    $("backdrop").classList.remove("show"); $("sheet").classList.remove("show");
    history.replaceState(null, "", location.pathname + location.search);
  }
  $("backdrop").addEventListener("click", closeSheet);
  $("closeSheet").addEventListener("click", closeSheet);

  async function shareLink(){
    if(!current) return;
    const url = new URL(location.href); url.hash = `app=${encodeURIComponent(current.id)}`;
    const data = { title: current.name, text: current.tagline || current.name, url: url.toString() };
    if(navigator.share){ try{ await navigator.share(data); return; }catch{} }
    try{ await navigator.clipboard.writeText(data.url); toast("リンクをコピーしました"); }
    catch{ prompt("このリンクをコピーしてください", data.url); }
  }
  $("shareBtn").addEventListener("click", shareLink);

  // ---- ハッシュから直接開く ----
  function fromHash(){
    const m = location.hash.match(/^#app=([^&]+)/);
    if(m) openSheet(decodeURIComponent(m[1]));
  }
  window.addEventListener("hashchange", fromHash);

  renderTabs(); renderGrid(); fromHash();
})();
</script>
</body>
</html>
