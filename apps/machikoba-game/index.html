<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>つなげ！町工場 〜奇跡のサプライチェーン〜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    background:#1b2432;
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
    color:#f0ead6;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:420px; margin:0 auto; height:100%;
    display:flex; flex-direction:column; position:relative;
  }
  /* ---- ヘッダー ---- */
  #hud{
    padding:10px 14px 6px;
  }
  #stageName{ font-size:13px; color:#ffd166; font-weight:bold; letter-spacing:1px;}
  #hudRow{
    display:flex; justify-content:space-between; align-items:baseline; margin-top:4px;
  }
  #money{ font-size:22px; font-weight:bold; color:#fff;}
  #money small{ font-size:12px; color:#9fb3c8;}
  #turns{ font-size:14px; color:#9fb3c8;}
  #turns b{ font-size:20px; color:#ff9f68;}
  #barWrap{
    height:10px; background:#0d1420; border-radius:5px; margin-top:6px; overflow:hidden;
  }
  #bar{
    height:100%; width:0%;
    background:linear-gradient(90deg,#06d6a0,#ffd166);
    border-radius:5px; transition:width .4s;
  }
  #goalText{ font-size:11px; color:#9fb3c8; margin-top:3px; text-align:right;}
  /* ---- 盤面 ---- */
  #boardWrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0;}
  canvas{ touch-action:none; display:block; }
  /* ---- 職人ゲージ ---- */
  #master{
    padding:6px 14px 14px; font-size:12px; color:#9fb3c8;
  }
  #masterRow{ display:flex; align-items:center; gap:8px;}
  #masterGaugeWrap{ flex:1; height:8px; background:#0d1420; border-radius:4px; overflow:hidden;}
  #masterGauge{ height:100%; width:0%; background:#5aa9e6; border-radius:4px; transition:width .3s;}
  #masterLv{ color:#ffd166; font-weight:bold; white-space:nowrap;}
  /* ---- トースト（製品完成） ---- */
  #toast{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.8);
    background:rgba(13,20,32,.92); border:2px solid #ffd166; border-radius:14px;
    padding:14px 22px; text-align:center; opacity:0; pointer-events:none;
    transition:all .25s; z-index:20; min-width:230px;
  }
  #toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1);}
  #toastName{ font-size:16px; font-weight:bold; color:#ffd166;}
  #toastMoney{ font-size:22px; font-weight:bold; color:#06d6a0; margin-top:4px;}
  #toastDetail{ font-size:11px; color:#9fb3c8; margin-top:4px;}
  /* ---- オーバーレイ画面 ---- */
  .screen{
    position:absolute; inset:0; z-index:30;
    background:rgba(13,20,32,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px; gap:14px;
  }
  .screen.hidden{ display:none; }
  .title-main{ font-size:30px; font-weight:bold; color:#ffd166; line-height:1.3; text-shadow:0 3px 0 #7a4a12;}
  .title-sub{ font-size:15px; color:#5aa9e6; font-weight:bold; letter-spacing:2px;}
  .story{ font-size:13px; line-height:1.9; color:#cfd8e3; max-width:320px;}
  .btn{
    font-size:17px; font-weight:bold; color:#1b2432;
    background:linear-gradient(180deg,#ffd166,#ff9f68);
    border:none; border-radius:30px; padding:14px 46px;
    box-shadow:0 4px 0 #b06a2c; cursor:pointer;
    font-family:inherit;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #b06a2c;}
  .rules{
    font-size:12px; line-height:1.9; color:#cfd8e3; text-align:left;
    background:#0d1420; border-radius:12px; padding:14px 18px; max-width:330px;
  }
  .rules b{ color:#ffd166;}
  .chip{ display:inline-block; border-radius:6px; padding:1px 7px; font-weight:bold; font-size:11px; margin:0 1px;}
  .chip.m{ background:#8d99ae; color:#1b2432;}
  .chip.t{ background:#5aa9e6; color:#1b2432;}
  .chip.d{ background:#f4989c; color:#1b2432;}
  .chip.s{ background:#06d6a0; color:#1b2432;}
  .big{ font-size:26px; font-weight:bold;}
  .clear{ color:#06d6a0;}
  .fail{ color:#ff6b6b;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="stageName">ステージ1</div>
    <div id="hudRow">
      <div id="money">0<small> 万円</small></div>
      <div id="turns">残りターン <b>8</b></div>
    </div>
    <div id="barWrap"><div id="bar"></div></div>
    <div id="goalText">目標 1,500万円</div>
  </div>

  <div id="boardWrap"><canvas id="board"></canvas></div>

  <div id="master">
    <div id="masterRow">
      <span>🧓 技術承継</span>
      <div id="masterGaugeWrap"><div id="masterGauge"></div></div>
      <span id="masterLv">職人Lv1 (×1.0)</span>
    </div>
  </div>

  <div id="toast">
    <div id="toastName"></div>
    <div id="toastMoney"></div>
    <div id="toastDetail"></div>
  </div>

  <!-- タイトル画面 -->
  <div id="titleScreen" class="screen">
    <div class="title-sub">〜奇跡のサプライチェーン〜</div>
    <div class="title-main">つなげ！<br>町工場</div>
    <div class="rules">
      <b>あそびかた</b><br>
      <span class="chip m">🔩 素材</span> から始めて
      <span class="chip t">🏭 技術</span> を通り、
      <span class="chip s">🏪 販売</span> でつなぎ終えると製品が完成！<br>
      ・となり合うマスを一筆書きでなぞろう<br>
      ・<span class="chip d">🎨 デザイン</span> を通すと売上 <b>×1.5</b><br>
      ・長くつなぐほど高く売れる！<br>
      ・製品を作るたびに <b>技術承継ゲージ</b> がたまり、職人がパワーアップ
    </div>
    <button class="btn" id="startBtn">再生をはじめる</button>
  </div>

  <!-- ステージ導入 -->
  <div id="stageScreen" class="screen hidden">
    <div class="title-sub" id="stageTitle"></div>
    <div class="story" id="stageStory"></div>
    <div class="story" id="stageMission" style="color:#ffd166;font-weight:bold;"></div>
    <button class="btn" id="stageBtn">スタート</button>
  </div>

  <!-- リザルト -->
  <div id="resultScreen" class="screen hidden">
    <div class="big" id="resultTitle"></div>
    <div class="story" id="resultText"></div>
    <button class="btn" id="resultBtn"></button>
  </div>
</div>

<script>
"use strict";
/* ============ 定数 ============ */
const COLS = 6, ROWS = 7;
const TYPES = {
  M: { icon:"🔩", label:"素材",   color:"#8d99ae", weight:30 },
  T: { icon:"🏭", label:"技術",   color:"#5aa9e6", weight:30 },
  D: { icon:"🎨", label:"デザイン", color:"#f4989c", weight:15 },
  S: { icon:"🏪", label:"販売",   color:"#06d6a0", weight:25 },
};
const STAGES = [
  { name:"ステージ1：錆びついた工場街",
    story:"後継者不足で廃業寸前の工場街。まずは眠っている技術と素材をつないで、運転資金を稼ごう。",
    target:1500, turns:8 },
  { name:"ステージ2：商店街の復活",
    story:"隣町の商店街から業務提携のオファーが！販路が広がったが、返すべき債務も大きい。",
    target:4000, turns:8 },
  { name:"ステージ3：地域ブランドへ",
    story:"ついに地域ぐるみのブランド立ち上げへ。デザインの力を活かして、大ヒット商品を生み出せ！",
    target:9000, turns:9 },
];
const GAUGE_MAX = 15;          // 承継ゲージ満タンに必要なポイント
const ADJ_RADIUS = 0.42;       // タッチ判定の半径（セル比）

const PRODUCT_ADJ = ["奇跡の","匠の","下町の","未来型","名物"];
const PRODUCT_PLAIN = ["スマホスタンド","工具セット","キッチンツール","自転車パーツ","収納ラック"];
const PRODUCT_DESIGN = ["デザイン雑貨","北欧風ランプ","アートな文具","おしゃれ鉄器","限定トートバッグ"];

/* ============ 状態 ============ */
let grid = [];        // grid[r][c] = {type, drop(px落下オフセット)}
let chain = [];       // なぞり中のセル [{r,c},...]
let dragging = false;
let pointerPos = null;
let money = 0, turns = 0, stageIdx = 0;
let masterLv = 1, gauge = 0;
let playing = false;

/* ============ DOM ============ */
const $ = id => document.getElementById(id);
const canvas = $("board"), ctx = canvas.getContext("2d");
let cell = 58, boardW = 0, boardH = 0, dpr = 1;

/* ============ 盤面生成 ============ */
function randType(){
  const total = Object.values(TYPES).reduce((a,t)=>a+t.weight,0);
  let r = Math.random()*total;
  for (const k of Object.keys(TYPES)){
    r -= TYPES[k].weight;
    if (r < 0) return k;
  }
  return "M";
}
function newGrid(){
  grid = [];
  for (let r=0;r<ROWS;r++){
    const row = [];
    for (let c=0;c<COLS;c++) row.push({ type:randType(), drop:0 });
    grid.push(row);
  }
  // 詰み防止：各タイプ最低3個保証
  for (const k of Object.keys(TYPES)){
    let count = 0;
    for (const row of grid) for (const cellObj of row) if (cellObj.type===k) count++;
    while (count < 3){
      const r = Math.floor(Math.random()*ROWS), c = Math.floor(Math.random()*COLS);
      grid[r][c].type = k; count++;
    }
  }
}

/* ============ サイズ調整 ============ */
function resize(){
  const wrap = $("boardWrap");
  const availW = Math.min(wrap.clientWidth, 420) - 16;
  const availH = wrap.clientHeight - 8;
  cell = Math.floor(Math.min(availW / COLS, availH / ROWS));
  cell = Math.max(40, Math.min(cell, 66));
  boardW = cell * COLS; boardH = cell * ROWS;
  dpr = window.devicePixelRatio || 1;
  canvas.width = boardW * dpr; canvas.height = boardH * dpr;
  canvas.style.width = boardW + "px"; canvas.style.height = boardH + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resize);

/* ============ 描画 ============ */
function roundRect(x,y,w,h,rad){
  ctx.beginPath();
  ctx.moveTo(x+rad,y);
  ctx.arcTo(x+w,y,x+w,y+h,rad);
  ctx.arcTo(x+w,y+h,x,y+h,rad);
  ctx.arcTo(x,y+h,x,y,rad);
  ctx.arcTo(x,y,x+w,y,rad);
  ctx.closePath();
}
function center(rc){ return { x: rc.c*cell + cell/2, y: rc.r*cell + cell/2 + grid[rc.r][rc.c].drop }; }
function inChain(r,c){ return chain.some(p=>p.r===r&&p.c===c); }

function draw(){
  ctx.clearRect(0,0,boardW,boardH);
  // セル
  for (let r=0;r<ROWS;r++){
    for (let c=0;c<COLS;c++){
      const cellObj = grid[r][c];
      const t = TYPES[cellObj.type];
      const x = c*cell, y = r*cell + cellObj.drop;
      const pad = cell*0.06;
      const selected = inChain(r,c);
      ctx.save();
      if (selected){ ctx.shadowColor = "#ffd166"; ctx.shadowBlur = 12; }
      ctx.fillStyle = selected ? "#ffffff" : t.color;
      roundRect(x+pad, y+pad, cell-pad*2, cell-pad*2, cell*0.18);
      ctx.fill();
      ctx.restore();
      if (selected){
        ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 3;
        roundRect(x+pad, y+pad, cell-pad*2, cell-pad*2, cell*0.18);
        ctx.stroke();
      }
      ctx.font = `${Math.floor(cell*0.42)}px serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(t.icon, x+cell/2, y+cell/2 - cell*0.08);
      ctx.font = `bold ${Math.floor(cell*0.17)}px sans-serif`;
      ctx.fillStyle = "#1b2432";
      ctx.fillText(t.label, x+cell/2, y+cell/2 + cell*0.28);
    }
  }
  // つなぎ線
  if (chain.length > 0){
    const valid = isValidChain();
    ctx.strokeStyle = valid ? "rgba(6,214,160,.85)" : "rgba(255,209,102,.75)";
    ctx.lineWidth = cell*0.14; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    const p0 = center(chain[0]);
    ctx.moveTo(p0.x, p0.y);
    for (let i=1;i<chain.length;i++){
      const p = center(chain[i]); ctx.lineTo(p.x, p.y);
    }
    if (dragging && pointerPos) ctx.lineTo(pointerPos.x, pointerPos.y);
    ctx.stroke();
  }
}
function tick(){
  // 落下アニメ
  for (const row of grid) for (const cellObj of row){
    if (cellObj.drop < 0) cellObj.drop = Math.min(0, cellObj.drop + cell*0.15);
  }
  draw();
  requestAnimationFrame(tick);
}

/* ============ チェーン判定 ============ */
function isValidChain(){
  if (chain.length < 3) return false;
  if (grid[chain[0].r][chain[0].c].type !== "M") return false;
  if (grid[chain[chain.length-1].r][chain[chain.length-1].c].type !== "S") return false;
  return chain.some(p => grid[p.r][p.c].type === "T");
}
function chainCounts(){
  const n = { M:0, T:0, D:0, S:0 };
  for (const p of chain) n[grid[p.r][p.c].type]++;
  return n;
}

/* ============ 入力 ============ */
function posToCell(e){
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  pointerPos = { x, y };
  const c = Math.floor(x / cell), r = Math.floor(y / cell);
  if (r<0||r>=ROWS||c<0||c>=COLS) return null;
  const cx = c*cell + cell/2, cy = r*cell + cell/2;
  const dist = Math.hypot(x-cx, y-cy);
  if (dist > cell*ADJ_RADIUS) return null;   // マスの中心付近のみ反応
  return { r, c };
}
function isAdjacent(a,b){
  return Math.abs(a.r-b.r)<=1 && Math.abs(a.c-b.c)<=1 && !(a.r===b.r&&a.c===b.c);
}
canvas.addEventListener("pointerdown", e => {
  if (!playing) return;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){ /* 合成イベント等では無視 */ }
  const p = posToCell(e);
  if (p && grid[p.r][p.c].type === "M"){
    dragging = true; chain = [p]; beep(440, .05);
  }
});
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const p = posToCell(e);
  if (!p) return;
  const last = chain[chain.length-1];
  // 一つ前に戻る（指を戻したら取り消し）
  if (chain.length >= 2){
    const prev = chain[chain.length-2];
    if (p.r===prev.r && p.c===prev.c){ chain.pop(); beep(330,.04); return; }
  }
  if (!inChain(p.r,p.c) && isAdjacent(last,p)){
    chain.push(p);
    beep(440 + chain.length*40, .05);
  }
});
canvas.addEventListener("pointerup", () => {
  if (!dragging) return;
  dragging = false; pointerPos = null;
  if (isValidChain()) completeProduct();
  chain = [];
});
canvas.addEventListener("pointercancel", () => { dragging = false; chain = []; pointerPos = null; });

/* ============ 製品完成 ============ */
function masterMult(){ return 1 + (masterLv - 1) * 0.2; }

function completeProduct(){
  const n = chainCounts();
  const len = chain.length;
  let revenue = len * 80;                 // 基本：1マス80万円
  revenue += Math.max(0, n.M - 1) * 40;   // 追加素材ボーナス
  const designMult = 1 + n.D * 0.5;
  revenue = Math.round(revenue * designMult * masterMult());

  money += revenue;
  turns--;

  // 製品名
  const adj = PRODUCT_ADJ[Math.floor(Math.random()*PRODUCT_ADJ.length)];
  const pool = n.D > 0 ? PRODUCT_DESIGN : PRODUCT_PLAIN;
  const item = pool[Math.floor(Math.random()*pool.length)];
  showToast(`『${adj}${item}』完成！`, `+${revenue.toLocaleString()}万円`,
    `${len}社連携${n.D>0?` ／ デザイン×${designMult}`:""}${masterLv>1?` ／ 職人×${masterMult().toFixed(1)}`:""}`);
  beep(880,.1); setTimeout(()=>beep(1174,.15), 90);

  // 承継ゲージ
  gauge += len;
  while (gauge >= GAUGE_MAX){
    gauge -= GAUGE_MAX; masterLv++;
    setTimeout(()=>showToast("🧓→🧑 技術承継 成功！", `職人Lv${masterLv}`, `売上倍率 ×${masterMult().toFixed(1)} にアップ`), 1300);
  }

  // 使ったマスを消して落下補充
  removeAndRefill();
  updateHud();

  // 勝敗判定（トーストが見えるよう少し待つ）
  setTimeout(()=>{
    if (money >= STAGES[stageIdx].target) stageClear();
    else if (turns <= 0) stageFail();
  }, 1100);
}

function removeAndRefill(){
  const used = new Set(chain.map(p=>`${p.r},${p.c}`));
  for (let c=0;c<COLS;c++){
    const remain = [];
    for (let r=ROWS-1;r>=0;r--){
      if (!used.has(`${r},${c}`)) remain.push(grid[r][c]);
    }
    for (let r=ROWS-1;r>=0;r--){
      const idx = ROWS-1-r;
      if (idx < remain.length){
        const from = grid.findIndex ? null : null; // noop
        grid[r][c] = remain[idx];
      } else {
        grid[r][c] = { type:randType(), drop:-(cell*(idx-remain.length+1)+cell*0.5) };
      }
    }
  }
}

/* ============ HUD / トースト ============ */
function updateHud(){
  const st = STAGES[stageIdx];
  $("stageName").textContent = st.name;
  $("money").innerHTML = `${money.toLocaleString()}<small> 万円</small>`;
  $("turns").innerHTML = `残りターン <b>${turns}</b>`;
  $("bar").style.width = Math.min(100, money/st.target*100) + "%";
  $("goalText").textContent = `目標 ${st.target.toLocaleString()}万円`;
  $("masterGauge").style.width = (gauge/GAUGE_MAX*100) + "%";
  $("masterLv").textContent = `職人Lv${masterLv} (×${masterMult().toFixed(1)})`;
}
let toastTimer = null;
function showToast(name, moneyText, detail){
  $("toastName").textContent = name;
  $("toastMoney").textContent = moneyText;
  $("toastDetail").textContent = detail;
  const t = $("toast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1400);
}

/* ============ 画面遷移 ============ */
function showStageIntro(){
  playing = false;
  const st = STAGES[stageIdx];
  $("stageTitle").textContent = st.name;
  $("stageStory").textContent = st.story;
  $("stageMission").textContent = `ミッション：${st.turns}ターン以内に ${st.target.toLocaleString()}万円 を稼げ！`;
  $("stageScreen").classList.remove("hidden");
}
function startStage(){
  const st = STAGES[stageIdx];
  money = 0; turns = st.turns; gauge = (stageIdx===0 && masterLv===1) ? 0 : gauge;
  newGrid(); updateHud();
  $("stageScreen").classList.add("hidden");
  playing = true;
}
function stageClear(){
  if (!playing) return;
  playing = false;
  const last = stageIdx === STAGES.length-1;
  $("resultTitle").textContent = last ? "🎉 全ステージクリア！" : "✨ ステージクリア！";
  $("resultTitle").className = "big clear";
  $("resultText").textContent = last
    ? `町はすっかり活気を取り戻した。あなたのつないだサプライチェーンは、地域の未来そのものだ。（最終職人Lv${masterLv}）`
    : `債務を完済！ ${money.toLocaleString()}万円を稼ぎ、町に明かりが戻ってきた。`;
  $("resultBtn").textContent = last ? "タイトルへ" : "次のステージへ";
  $("resultBtn").onclick = () => {
    $("resultScreen").classList.add("hidden");
    if (last){
      stageIdx = 0; masterLv = 1; gauge = 0;
      $("titleScreen").classList.remove("hidden");
    } else {
      stageIdx++; showStageIntro();
    }
  };
  $("resultScreen").classList.remove("hidden");
}
function stageFail(){
  if (!playing) return;
  playing = false;
  $("resultTitle").textContent = "💧 資金ショート…";
  $("resultTitle").className = "big fail";
  $("resultText").textContent = `目標まであと ${(STAGES[stageIdx].target - money).toLocaleString()}万円 足りなかった。だが職人の技は残っている。もう一度挑戦しよう。`;
  $("resultBtn").textContent = "リトライ";
  $("resultBtn").onclick = () => {
    $("resultScreen").classList.add("hidden");
    showStageIntro();
  };
  $("resultScreen").classList.remove("hidden");
}

$("startBtn").onclick = () => {
  $("titleScreen").classList.add("hidden");
  stageIdx = 0; masterLv = 1; gauge = 0;
  showStageIntro();
};
$("stageBtn").onclick = startStage;

/* ============ サウンド（シンプルなビープ） ============ */
let audioCtx = null;
function beep(freq, dur){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){ /* 音が出ない環境でも続行 */ }
}

/* ============ 起動 ============ */
resize();
newGrid();
updateHud();
tick();
</script>
